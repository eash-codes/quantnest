[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantnest"
version = "11.3.0"
description = "A trading simulator built with domain-driven design"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic[email]>=2.6",
    "sqlalchemy>=2.0",
    "yfinance>=0.2",
    # Authentication
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4 reads bcrypt.__about__, which bcrypt 4.1 removed.
    "bcrypt<4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
quantnest = "quantnest.main:main"

[tool.hatch.build.targets.wheel]
packages = ["quantnest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]

[tool.coverage.run]
source = ["quantnest"]
omit = ["*/__pycache__/*", "*/tests/*"]
