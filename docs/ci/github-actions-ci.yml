name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic prices: CI has no business depending on Yahoo Finance being up.
  QUANTNEST_MARKET_PROVIDER: fake
  LOG_FORMAT: console

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify the DDD boundary
        # An architectural invariant, enforced by CI rather than by hoping a
        # reviewer notices. Parses the AST so a deliberate lazy import inside
        # a function body is allowed, while a module-level one fails.
        run: python scripts/check_architecture.py

      - name: Check for print() used as logging
        run: |
          if grep -rn "^\s*print(" quantnest/ --include=*.py; then
            echo "::error::Use the logging module, not print()"
            exit 1
          fi
          echo "No stray print() calls"

      - name: Route security audit
        # Walks the whole route table and fails if any endpoint accepts a
        # caller-supplied wallet id without verifying ownership. Added after
        # POST /orders shipped unprotected because it takes wallet_id in the
        # body and so bypassed the path-based dependency.
        run: pytest tests/integration/test_route_security.py -q

      - name: Tests
        run: pytest -q --cov=quantnest --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: quantnest-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: quantnest-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the API container
        # Proves the image actually boots and serves traffic — a build that
        # succeeds can still crash on startup from a missing dependency.
        run: |
          docker run -d --name quantnest-smoke \
            -e JWT_SECRET_KEY="$(openssl rand -hex 32)" \
            -e QUANTNEST_MARKET_PROVIDER=fake \
            -e ENVIRONMENT=production \
            -p 8000:8000 quantnest-api:ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health > /dev/null; then
              echo "API is healthy after ${attempt}s"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::API never became healthy"
              docker logs quantnest-smoke
              exit 1
            fi
            sleep 1
          done

          echo "Registering a user against the container..."
          STATUS=$(curl --silent --output /tmp/register.json --write-out '%{http_code}' \
            -X POST http://localhost:8000/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}')

          if [ "$STATUS" != "201" ]; then
            echo "::error::Registration failed with HTTP $STATUS"
            cat /tmp/register.json
            docker logs quantnest-smoke
            exit 1
          fi

          echo "Verifying an unauthenticated request is refused..."
          STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:8000/portfolio/some-wallet/summary)

          if [ "$STATUS" != "401" ]; then
            echo "::error::Expected 401 for an unauthenticated request, got $STATUS"
            exit 1
          fi

          echo "Container smoke test passed"

      - name: Container logs
        if: always()
        run: docker logs quantnest-smoke || true

      - name: Clean up
        if: always()
        run: docker rm -f quantnest-smoke || true
